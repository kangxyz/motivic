name: Motivic CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  lean:
    permissions:
      contents: write
    uses: kangxyz/aglib/.github/workflows/lean-ci.yml@5489643158f3ec9b30ca26c1084bc21fc611e969
    with:
      package-directory: .
      build-targets: Motivic
