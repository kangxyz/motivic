name: GitHub CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Preserve the existing queue identity when changing the display name.
  group: Motivic CI-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  lean:
    permissions:
      contents: write
    uses: kangxyz/aglib/.github/workflows/lean-ci.yml@df546357ef7cdc1839c3aed0210ab52184f71694
    with:
      package-directory: .
      build-targets: Motivic
