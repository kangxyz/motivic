name: Motivic CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  lean:
    permissions:
      contents: write
    uses: kangxyz/aglib/.github/workflows/lean-ci.yml@afd32da9533fe7f5823dd0685958834a5470e5aa
    with:
      package-directory: .
      build-targets: Motivic
