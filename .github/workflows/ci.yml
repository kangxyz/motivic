# Authors: kangxyz
name: Motivic CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  library:
    permissions:
      contents: write
      actions: read
    uses: kangxyz/aglib/.github/workflows/lean-ci.yml@1d990dcd149c2f9fd605b4d21b25e1c54cff9789
    with:
      config: .github/lean-ci.toml
      legacy-dependencies-prefix: dependencies-v1
      legacy-dependencies-paths: |
        .lake/packages
      legacy-builds-prefixes: |
        motivic-build-v2
        motivic-build-v1
      legacy-builds-paths: |
        .lake/build
        examples/downstream/.lake/build
