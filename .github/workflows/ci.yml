name: Motivic CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  lean:
    permissions:
      contents: write
    uses: kangxyz/aglib/.github/workflows/lean-ci.yml@6c8f51ca331261f88b33bb9c22ef7d33adf01da4
    with:
      package-directory: .
      build-targets: Motivic
