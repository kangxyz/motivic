name = "Motivic"
version = "0.1.0"
description = "Motivic cohomology, finite correspondences, and transfers in Lean."
keywords = ["math", "motivic-cohomology", "algebraic-geometry", "transfers"]
defaultTargets = ["Motivic"]
testDriver = "MotivicTest"
lintDriver = "batteries/runLinter"
lintDriverArgs = ["--no-build", "Motivic"]
builtinLint = true
enableArtifactCache = true
restoreAllArtifacts = true
# Resource-only flags retain the native artifact trace.
weakLeanArgs = ["-M12800", "-j4"]

[[lean_lib]]
name = "Motivic"
leanOptions = {autoImplicit = false, maxHeartbeats = 200000, weak.linter.mathlibStandardSet = true, warningAsError = true}

[[lean_lib]]
name = "MotivicTest"
globs = ["MotivicTest.+"]
leanOptions = {autoImplicit = false, maxHeartbeats = 200000, warningAsError = true}

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"

[[require]]
name = "Aglib"
git = "https://github.com/kangxyz/aglib.git"
rev = "2c34f185fa859e862661f939cd216b07bcccfb26"
